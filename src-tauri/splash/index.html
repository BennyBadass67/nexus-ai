<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;background:#050810;color:#eaf1ff;font-family:Segoe UI,system-ui,sans-serif;display:grid;place-items:center;overflow:hidden}
.o{position:fixed;width:60vw;height:60vw;border-radius:50%;filter:blur(90px);opacity:.5;background:#2f6bff;left:-15vw;top:-20vw}
.p{position:fixed;width:45vw;height:45vw;border-radius:50%;filter:blur(90px);opacity:.4;background:#7a4dff;right:-10vw;bottom:-15vw}
.c{position:relative;text-align:center}.l{width:64px;height:64px;border-radius:20px;margin:0 auto 18px;background:linear-gradient(135deg,#d5ebff,#6b9bff 60%,#8d6bff);box-shadow:0 12px 40px -8px rgba(90,169,255,.8);animation:b 1.6s ease-in-out infinite}
@keyframes b{50%{transform:scale(1.08)}}h1{font-size:20px;letter-spacing:.1em;margin:0 0 6px}p{margin:0;color:#ffffff80;font-size:13px}
</style></head><body><div class="o"></div><div class="p"></div><div class="c"><div class="l"></div><h1>NEXUS AI</h1><p id="s">Starter...</p></div></body></html>
